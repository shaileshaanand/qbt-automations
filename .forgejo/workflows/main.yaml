on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: debian-large
    steps:
      - name: Install Docker CLI and Buildx
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: git.shailesh.live
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Set image revision
        run: echo "FORGEJO_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build and push backend Docker image
        run: |
          docker buildx build --progress plain --push --no-cache \
            --file Dockerfile \
            --tag git.shailesh.live/shailesh/qbt-automations:${{ env.FORGEJO_SHA }} \
            --tag git.shailesh.live/shailesh/qbt-automations:latest \
            .
